name: Check updates and build iOS streams
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      stream:
        description: Streams to build and release
        type: choice
        default: current
        options:
          - current
          - multiplayer
          - pokermon
          - multiplayer-legacy
      replace_ipa:
        description: Replace the selected stream's existing IPA using its pinned dependencies (select one stream)
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['scripts/**', 'native/**', 'static-mods/**', 'mod-configs/**', 'assets/**', 'pyproject.toml', 'uv.lock', 'versions.lock.json', '.github/workflows/**']
permissions:
  contents: read
concurrency:
  group: ios-builder
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'tanakrit-d/balatro-ios-mod-builder'
    runs-on: macos-latest
    outputs:
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      - run: uv sync --frozen --no-install-project --no-dev
      - run: uv run --no-sync python -m unittest discover -s tests -v
      - id: resolve
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILD_STREAM: ${{ inputs.stream || 'current' }}
          REPLACE_IPA: ${{ inputs.replace_ipa || false }}
        run: |
          uv run --no-sync python scripts/build_plan.py
      - name: Rebuild Mobile Maker runtime with pinned dependencies
        if: steps.resolve.outputs.build == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --no-sync python scripts/runtime.py
      - name: Build selected streams
        if: steps.resolve.outputs.build == 'true'
        env:
          BALATRO_GAME_KEY: ${{ secrets.BALATRO_GAME_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          BUILD_STREAM: ${{ inputs.stream || 'current' }}
        run: |
          for stream in $(python3 -c 'import json; print(" ".join(json.load(open("versions.lock.json"))["build"]["streams"]))'); do
            uv run --no-sync python scripts/builder.py build --stream "$stream" --base .build/base.ipa
          done
      - uses: actions/upload-artifact@v7
        if: steps.resolve.outputs.build == 'true'
        with:
          name: balatro-ios
          path: |
            dist/*.ipa
            versions.lock.json
          retention-days: 7
  publish:
    needs: build
    if: needs.build.outputs.build == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: balatro-ios
          path: .
      - name: Publish stream releases
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_STREAM: ${{ inputs.stream || 'current' }}
        run: |
          for stream in $(python3 -c 'import json; print(" ".join(json.load(open("versions.lock.json"))["build"]["streams"]))'); do
            extra=()
            if [[ "${{ inputs.replace_ipa || false }}" == "true" ]]; then extra+=(--replace-existing); fi
            python3 scripts/releases.py --stream "$stream" --repo tanakrit-d/balatro-ios-mod-builder "${extra[@]}"
          done
      - uses: actions/upload-artifact@v7
        if: always() && inputs.replace_ipa
        with:
          name: replaced-ipa-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/release-backups/
          if-no-files-found: error
          retention-days: 90
