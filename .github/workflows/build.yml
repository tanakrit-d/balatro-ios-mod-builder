name: Check updates and build iOS streams
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', 'native/**', 'static-mods/**', 'assets/**', 'pyproject.toml', 'uv.lock', 'versions.lock.json', '.github/workflows/**']
permissions:
  contents: read
concurrency:
  group: ios-builder
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-latest
    outputs:
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      - run: uv sync --frozen --no-install-project --no-dev
      - run: uv run --no-sync python -m unittest discover -s tests -v
      - uses: actions/cache/restore@v6
        with:
          path: .build/last-success.json
          key: stream-state-${{ github.run_id }}
          restore-keys: stream-state-
      - id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run --no-sync python scripts/builder.py resolve
          if [ '${{ github.event_name }}' = schedule ] && cmp -s versions.lock.json .build/last-success.json; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild Mobile Maker runtime with latest Lovely
        if: steps.resolve.outputs.build == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --no-sync python scripts/runtime.py
      - name: Build both streams
        if: steps.resolve.outputs.build == 'true'
        env:
          BALATRO_GAME_KEY: ${{ secrets.BALATRO_GAME_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run --no-sync python scripts/builder.py build --stream multiplayer --base .build/base.ipa
          uv run --no-sync python scripts/builder.py build --stream pokermon --base .build/base.ipa
      - uses: actions/upload-artifact@v7
        if: steps.resolve.outputs.build == 'true'
        with:
          name: balatro-ios
          path: |
            dist/*.ipa
            versions.lock.json
          retention-days: 7
  publish:
    needs: build
    if: needs.build.outputs.build == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: balatro-ios
          path: .
      - name: Publish stream releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/releases.py
      - name: Record successful publication
        run: |
          mkdir -p .build
          cp versions.lock.json .build/last-success.json
      - uses: actions/cache/save@v6
        with:
          path: .build/last-success.json
          key: stream-state-${{ github.run_id }}
