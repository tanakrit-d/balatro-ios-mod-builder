# Disables the CRT shader
# This is a workaround to the shader blocking most of the screen with black on Pixel and some other devices.
# If your device is not affected you can delete this patch file
# Will wash out the colours when active
# Compatible with both vanilla game and Steamodded (smods)
[manifest]
version = "1.0.0"
priority = 9999

# Set CRT intensity to 0 in settings
[[patches]]
[patches.pattern]
target = "globals.lua"
pattern = "crt = 70,"
position = "at"
payload = '''
crt = 0,
'''
match_indent = true
times = 1

# Remove vanilla CRT shader application (if present in game.lua)
[[patches]]
[patches.regex]
target = "game.lua"
pattern = ".*love\\.graphics\\.setShader\\(\\s*G\\.SHADERS\\['CRT'\\]\\s*\\).*\n"
position = "at"
payload = ''''''
match_indent = true
times = 100

# Remove vanilla CRT noise_fac send (if present in game.lua)
[[patches]]
[patches.regex]
target = "game.lua"
pattern = ".*G\\.SHADERS\\['CRT'\\]:send\\('noise_fac'.*\n"
position = "at"
payload = ''''''
match_indent = true
times = 100
